<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="让算法，看得见。免费的中文数据结构与算法可视化实验室，交互学习排序、查找、栈、队列、二叉搜索树与图遍历。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="算法工坊">
  <meta property="og:title" content="算法工坊 · 让算法，看得见">
  <meta property="og:description" content="免费的中文数据结构与算法可视化实验室，交互学习排序、查找、栈、队列、二叉搜索树与图遍历。">
  <meta name="twitter:card" content="summary">
  <title>算法工坊 · 让算法，看得见</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到实验区</a>
  <aside class="sidebar" id="sidebar" aria-label="算法导航">
    <a class="brand" href="#quick"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>算法工坊</span></a>
    <button class="search-button" id="open-search"><span data-icon="search"></span><span>搜索算法</span><kbd>⌘ K</kbd></button>
    <div class="nav-label">探索算法 <span id="catalog-count">08</span></div>
    <nav id="algorithm-nav"></nav>
  </aside>
  <div class="nav-overlay" id="nav-overlay" hidden></div>
  <div class="page">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="menu-button" aria-label="打开算法导航" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
      <div class="breadcrumbs"><span>算法实验室</span><span class="slash">/</span><span id="breadcrumb">排序算法</span></div>
      <div class="top-actions"><button class="icon-button" id="theme-button" aria-label="切换深色模式"><span data-icon="moon"></span></button><a class="icon-button" href="https://github.com/chalmery/algo-lab" target="_blank" rel="noopener noreferrer" aria-label="GitHub 源代码"><span data-icon="github"></span></a></div>
    </header>
    <main id="main" tabindex="-1">
      <div class="intro-row"><h1 id="algorithm-title">快速排序</h1><span class="difficulty" id="difficulty"></span></div>
      <div class="meta-row"><div class="meta-item"><span data-icon="timer"></span> 时间复杂度 <strong id="time-complexity"></strong></div><div class="meta-item"><span data-icon="database"></span> 空间复杂度 <strong id="space-complexity"></strong></div><div class="meta-tags" id="meta-tags"></div></div>
      <div class="workspace">
        <section class="experiment card" aria-label="交互可视化实验">
          <div class="experiment-head"><h2><span class="status-dot"></span> 可视化实验</h2><div class="head-right"><span class="step-counter" id="step-counter"></span><button class="icon-button small" id="fullscreen-button" aria-label="全屏显示实验"><span data-icon="expand"></span></button></div></div>
          <form id="data-form" class="data-form"><label for="data-input" id="data-label">输入数据</label><div class="data-input-row"><input id="data-input" autocomplete="off" spellcheck="false" aria-describedby="input-hint data-error"><button class="button secondary compact" type="submit">应用</button><button class="icon-button bordered" type="button" id="random-button" aria-label="生成随机数据"><span data-icon="shuffle"></span></button></div><p class="input-hint" id="input-hint">0–99 的整数，以逗号或空格分隔，最多 16 个</p><p id="data-error" class="error" role="alert"></p></form>
          <div class="operation-row" id="operation-row"></div>
          <div class="visual-stage" id="visual-stage" tabindex="0" aria-label="算法可视化，使用左右方向键单步查看"></div>
          <div id="auxiliary" class="auxiliary"></div>
          <div class="legend" id="legend"></div>
          <div class="stats" id="stats"></div>
          <div class="player">
            <div class="timeline-row"><span id="timeline-current">0</span><input type="range" id="timeline" min="0" max="1" value="0" aria-label="演示进度"><span id="timeline-total">0</span></div>
            <div class="player-controls"><div class="play-buttons"><button class="icon-button" id="reset-button" aria-label="回到开始"><span data-icon="reset"></span></button><button class="icon-button" id="prev-button" aria-label="上一步"><span data-icon="prev"></span></button><button class="play-button" id="play-button" aria-label="播放"><span data-icon="play"></span><span>播放演示</span></button><button class="icon-button" id="next-button" aria-label="下一步"><span data-icon="next"></span></button></div><label class="speed-control"><span data-icon="gauge"></span><select id="speed" aria-label="播放速度"><option value="1500">0.5×</option><option value="750" selected>1×</option><option value="375">2×</option><option value="187">4×</option></select></label></div>
          </div>
        </section>
        <aside class="inspector card" aria-label="步骤讲解与伪代码"><div class="inspector-tabs" role="tablist" aria-label="讲解面板"><button role="tab" id="tab-steps" aria-selected="true" aria-controls="panel-steps" tabindex="0">步骤讲解</button><button role="tab" id="tab-code" aria-selected="false" aria-controls="panel-code" tabindex="-1">伪代码</button></div><div id="panel-steps" role="tabpanel" aria-labelledby="tab-steps"><div class="step-explanation"><span class="explanation-label"><i></i> 当前步骤</span><h3 id="step-title">准备开始</h3><p id="step-message"></p></div><div class="variable-section"><h3>状态观察 <span data-icon="scan"></span></h3><dl id="variables"></dl></div><div class="history-section"><h3>执行记录 <span id="history-count"></span></h3><ol id="history"></ol></div></div><div id="panel-code" role="tabpanel" aria-labelledby="tab-code" hidden><p class="code-caption">同步高亮当前步骤</p><div id="code-lines" class="code-lines"></div></div><div class="keyboard-hint"><kbd>空格</kbd> 播放 / 暂停 <span>·</span> <kbd>←</kbd><kbd>→</kbd> 单步</div></aside>
      </div>
    </main>
  </div>
  <dialog id="search-dialog" class="search-dialog"><div class="dialog-heading"><h2>探索算法</h2><button class="icon-button" data-close="search-dialog" aria-label="关闭搜索"><span data-icon="close"></span></button></div><div class="dialog-search"><span data-icon="search"></span><input id="search-input" placeholder="搜索算法、分类或关键词…" aria-label="搜索算法" autocomplete="off"></div><div id="search-results"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
